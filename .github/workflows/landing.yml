name: Publish Decktation Landing

on:
  push:
    branches: ['**', '!gh-pages']
    paths:
      - 'site/**'
      - '.github/workflows/landing.yml'
      - 'scripts/publish-landing.sh'
      - 'scripts/branch-slug.py'
  pull_request:
    branches: [master, main]
    paths:
      - 'site/**'
      - '.github/workflows/landing.yml'
      - 'scripts/publish-landing.sh'
      - 'scripts/branch-slug.py'
  workflow_dispatch:

concurrency:
  group: pages-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  landing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: decktation-previews
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate static landing
        run: |
          python3 site/build.py
          node --check site/public/app.js
          bash -n scripts/publish-landing.sh
      - name: Checkout existing Pages content
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-site
      - name: Publish only landing files
        if: github.event_name != 'pull_request'
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
        run: bash scripts/publish-landing.sh
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site
          include-hidden-files: true
      - name: Deploy site
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
